name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop_app.py"
      - "installer.iss"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-windows-exe.yml"
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ocr.txt
      - name: Install application and OCR dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-ocr.txt
          python -m pip install pyinstaller
      - name: Build portable Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name HoaDonEX_PRO_TAMTH --paths backend --add-data "frontend;frontend" --collect-submodules app --collect-all paddleocr --collect-all paddle --collect-all cv2 --collect-all shapely --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on desktop_app.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y --force
      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe",
            "C:\\Program Files\\Inno Setup 6\\ISCC.exe",
            "C:\\Program Files (x86)\\Inno Setup\\ISCC.exe",
            "C:\\Program Files\\Inno Setup\\ISCC.exe"
          )
          $iscc = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) { $iscc = Get-Item $candidate; break }
          }
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\\Program Files (x86)", "C:\\Program Files", "C:\\ProgramData\\chocolatey\\lib\\innosetup" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup installation" }
          & $iscc.FullName installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }
      - name: Include setup notes
        shell: pwsh
        run: |
          @"
          HOA DON EX PRO – TAMTH | WINDOWS PORTABLE

          1. Giai nen toan bo thu muc.
          2. Chay HoaDonEX_PRO_TAMTH.exe.
          3. Lan dau can Internet de PaddleOCR tai mo hinh nhan dang neu chua co.
          4. Nap hai mau Excel goc tai muc Nap hai mau Excel goc.
          5. Du lieu hoa don duoc luu trong thu muc data canh file EXE.

          Khong can cai Python. Khong can mo CMD. Khong can may chu thue bao.
          Moi may tinh co co so du lieu rieng.
          "@ | Set-Content -Encoding UTF8 dist/HoaDonEX_PRO_TAMTH/README_CAI_DAT.txt
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: HoaDonEX_PRO_TAMTH_Windows_x64
          path: |
            dist/HoaDonEX_PRO_TAMTH_Setup.exe
            dist/HoaDonEX_PRO_TAMTH/
          if-no-files-found: error
          retention-days: 30
