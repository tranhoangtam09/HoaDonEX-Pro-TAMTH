services:
  - type: web
    name: hoa-don-ex-pro-tamth-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: hdx-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/invoices.sqlite3
      - key: TEMPLATES_DIR
        value: /var/data/templates
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: CORS_ORIGINS
        value: https://hoa-don-ex-pro-tamth-web.onrender.com
  - type: web
    name: hoa-don-ex-pro-tamth-web
    runtime: static
    region: singapore
    buildCommand: echo "Static frontend - no build step"
    staticPublishPath: ./frontend
